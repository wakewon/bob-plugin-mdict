name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^local_assets/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The developer's own dictionaries are not in the repository, so the
      # integration tests skip themselves here. Parser golden tests and API
      # tests run on synthetic fixtures and cover the same code paths.
      - name: Test
        run: go test ./... -count=1

      - name: Test Bob plugin contract
        run: node --test plugin/main.test.js

      - name: Test with race detector
        run: go test ./... -race -count=1

      - name: Confirm no dictionary data is tracked
        run: ./scripts/security-check.sh

      - name: Validate appcast source metadata
        run: ./scripts/validate-appcast.sh

  build:
    name: Build and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build purity and complete artifact verification
        run: |
          before=$(git status --porcelain --untracked-files=normal)
          ./scripts/release.sh build
          after=$(git status --porcelain --untracked-files=normal)
          test "$before" = "$after"

      - name: Smoke test the CLI on an empty library
        run: |
          mkdir -p "$RUNNER_TEMP/dicts"
          ./release/bob-mdict-darwin-arm64 --dictionary-dir "$RUNNER_TEMP/dicts" --check
          ./release/bob-mdict-darwin-arm64 --dictionary-dir "$RUNNER_TEMP/dicts" --list-dictionaries
          ./release/bob-mdict-darwin-arm64 --dictionary-dir "$RUNNER_TEMP/dicts" --rescan

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            release/*.bobplugin
            release/bob-mdict-*.tar.gz
            release/bob-mdict.rb
            release/SHA256SUMS
            release/RELEASE_MANIFEST.json
          retention-days: 14
