<div class="entry">
  <h1>flimber</h1>
  <span class="pron">/ˈflɪmbə/</span>
  <span class="pos">noun</span>
  <div class="sense">
    <span class="def">A small wooden tool used for smoothing clay.</span>
    <span class="example">She reached for the flimber and kept working.</span>
  </div>
  <div class="sense">
    <span class="def">The act of smoothing something by hand.</span>
  </div>
</div>
